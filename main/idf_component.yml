dependencies:
  espressif/esp_codec_dev:
    version: "1.3.4"
    matches:
      - if: "idf_version <6.0"
      - if: "idf_version >=6.0"
        version: "1.5.10"
  espressif/esp_hosted:
    version: "1.4.0"
    matches:
      - if: "idf_version <6.0"
      - if: "idf_version >=6.0"
        version: "~2"
  espressif/esp_lcd_ili9881c: "1.0.1"
  espressif/esp_lcd_st7703: "1.0.3"
  espressif/esp_lcd_touch: "1.1.2"
  espressif/esp_lcd_touch_gt911: "1.1.3"
  espressif/esp_lcd_touch_st7123: "1.0.0"
  espressif/esp_lvgl_port: "2.5.0"
  espressif/mdns: "1.11.3"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    matches:
      - if: "idf_version <6.0"
      - if: "idf_version >=6.0"
        version: ">=0.10,<2.0"
  espressif/usb_host_hid: "1.0.3"
  espressif/usb_host_cdc_acm: "^2.4.0"
  espressif/usb:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"
  lvgl/lvgl: "9.5.0"
